name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore PacePlanner.sln

      # Builds Core, Data, the WinUI 3 app (x64) and both test projects.
      - name: Build
        run: dotnet build PacePlanner.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PacePlanner.sln --configuration Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
